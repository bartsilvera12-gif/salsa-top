  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags, manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin, blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec, re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"display:block;height:2.5px;width:22px;margin:0 auto;background:#2A1F19;border-radius:2px\"><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <nav style=\"border-top:1px solid rgba(60,45,35,.08);background:rgba(255,244,234,.97);padding:10px 28px 22px;display:flex;flex-direction:column;gap:4px\">\n        <a href=\"#nosotros\" onclick=\"{{ closeMenu }}\" style=\"color:#26302E;font-weight:600;font-size:18px;padding:12px 4px;border-bottom:1px solid rgba(60,45,35,.06)\">Nosotros<\u002Fa>\n        <a href=\"#productos\" onclick=\"{{ closeMenu }}\" style=\"color:#26302E;font-weight:600;font-size:18px;padding:12px 4px;border-bottom:1px solid rgba(60,45,35,.06)\">Productos<\u002Fa>\n        <a href=\"#proceso\" onclick=\"{{ closeMenu }}\" style=\"color:#26302E;font-weight:600;font-size:18px;padding:12px 4px;border-bottom:1px solid rgba(60,45,35,.06)\">Proceso<\u002Fa>\n        <a href=\"#distribuidores\" onclick=\"{{ closeMenu }}\" style=\"color:#26302E;font-weight:600;font-size:18px;padding:12px 4px;border-bottom:1px solid rgba(60,45,35,.06)\">Distribuidores<\u002Fa>\n        <a href=\"#contacto\" onclick=\"{{ closeMenu }}\" style=\"color:#26302E;font-weight:600;font-size:18px;padding:12px 4px\">Contacto<\u002Fa>\n        <a href=\"https://wa.me/595994208200?text=Hola%20Salsa%20Top\" target=\"_blank\" onclick=\"{{ closeMenu }}\" style=\"margin-top:12px;text-align:center;background:linear-gradient(90deg,#FFD100,#FF8200 55%,#EF3340);color:#1A0E00;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:.04em;text-transform:uppercase;padding:13px;border-radius:999px\">Escribir por WhatsApp<\u002Fa>\n      <\u002Fnav>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <!-- ===================== HERO ===================== -->\n  <section id=\"top\" style=\"position:relative;padding:76px 28px 96px;background:radial-gradient(120% 90% at 50% -10%,#FFFFFF 0%,#FFF9F0 45%,#FFF4EA 100%);overflow:hidden\">\n    <div style=\"position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:520px;height:520px;background:radial-gradient(circle,rgba(255,130,0,.28),transparent 66%);filter:blur(20px);animation:floatglow 6s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.32em;text-transform:uppercase;font-size:15px;color:#C2410C\">Artesanal · Gourmet · Paraguay<\u002Fspan>\n\n      <div class=\"hero-logo\" style=\"position:relative;background:#FFFFFF;border-radius:24px;padding:34px 44px;max-width:680px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(60,45,35,.1)\">\n        <img src=\"b56c6660-0c8d-4f92-b674-f51a3880c4c4\" alt=\"Salsa Top\" style=\"width:100%;display:block\">\n      <\u002Fdiv>\n\n      <h1 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(38px,6.5vw,74px);line-height:.98;text-transform:uppercase;letter-spacing:.005em;max-width:16ch\">No es solo una salsa. <span style=\"background:linear-gradient(90deg,#FF8200,#EF3340);-webkit-background-clip:text;background-clip:text;color:transparent\">Es una experiencia gourmet.<\u002Fspan><\u002Fh1>\n\n      <p style=\"font-size:clamp(17px,2.2vw,21px);line-height:1.5;color:#4C5A58;max-width:60ch;font-weight:400\">Salsas picantes, agridulces y untables elaborados de forma artesanal, con ingredientes naturales de nuestra propia finca. Sabor auténtico, sin colorantes ni esencias artificiales.<\u002Fp>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px\">\n        <a href=\"#productos\" style=\"display:inline-flex;align-items:center;gap:10px;background:linear-gradient(90deg,#FFD100,#FF8200 55%,#EF3340);color:#1A0E00;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;padding:15px 30px;border-radius:999px;box-shadow:0 12px 30px rgba(239,51,64,.4)\">Ver productos<\u002Fa>\n        <a href=\"#distribuidores\" style=\"display:inline-flex;align-items:center;gap:10px;background:transparent;color:#241A14;border:1.5px solid rgba(60,45,35,.32);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;padding:15px 30px;border-radius:999px\">Quiero distribuir<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- fire divider -->\n  \n\n  <!-- ===================== NOSOTROS ===================== -->\n  <section id=\"nosotros\" style=\"padding:96px 28px;background:#FFF4EA\">\n    <div class=\"split reveal\" style=\"max-width:1180px;margin:0 auto;display:flex;gap:56px;align-items:center\">\n      <div style=\"flex:1;min-width:0\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:14px;color:#C2410C\">Quiénes somos<\u002Fspan>\n        <h2 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(32px,4.6vw,52px);line-height:1.02;text-transform:uppercase;margin:14px 0 22px\">De la tradición familiar a tu mesa<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.65;color:#4C5A58;margin-bottom:18px\">Somos una marca que nace de la tradición familiar en la producción artesanal de salsas picantes, agridulces, untables y otros productos relacionados a la gastronomía.<\u002Fp>\n        <p style=\"font-size:18px;line-height:1.65;color:#4C5A58\">Combinamos técnicas artesanales con ingredientes naturales de excelente calidad, muchos cultivados en nuestra propia finca, e insumos importados cuidadosamente seleccionados, para crear una línea gourmet auténtica y llena de sabor. <strong style=\"color:#241A14\">Salsa Top es símbolo de sabor y calidad garantizada.<\u002Fstrong><\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:34px;margin-top:34px\">\n          <div><div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:40px;line-height:1;background:linear-gradient(90deg,#FF8200,#EF3340);-webkit-background-clip:text;background-clip:text;color:transparent\">100%<\u002Fdiv><div style=\"color:#6A7775;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px\">Artesanal<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:40px;line-height:1;background:linear-gradient(90deg,#FF8200,#EF3340);-webkit-background-clip:text;background-clip:text;color:transparent\">0<\u002Fdiv><div style=\"color:#6A7775;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px\">Colorantes artificiales<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:40px;line-height:1;background:linear-gradient(90deg,#FF8200,#EF3340);-webkit-background-clip:text;background-clip:text;color:transparent\">Finca<\u002Fdiv><div style=\"color:#6A7775;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px\">Ingredientes propios<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:0;width:100%\">\n        <div class=\"glow-card\" style=\"position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 24px 60px rgba(0,0,0,.45);border:1px solid rgba(60,45,35,.08)\">\n          <img src=\"fabrica.jpg\" alt=\"Nuestra planta - Salsa Top\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;height:100%;object-fit:cover;object-position:center;display:block\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== OBJETIVO ===================== --><section id=\"objetivo\" style=\"padding:96px 28px;background:#FFF4EA\"><div class=\"reveal\" style=\"max-width:980px;margin:0 auto\"><div style=\"text-align:center;margin-bottom:38px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:14px;color:#C2410C\">Hacia dónde vamos</span><h2 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(30px,4.4vw,50px);line-height:1.02;text-transform:uppercase;margin-top:12px;color:#241A14\">Nuestro objetivo</h2></div><div style=\"display:grid;gap:20px\"><p style=\"color:#4C5A58;font-size:18px;line-height:1.65\">Construimos una marca de excelencia con productos únicos, hechos de forma artesanal y con ingredientes naturales, frescos y seleccionados, para llevar sabor auténtico al mundo.</p><p style=\"color:#4C5A58;font-size:18px;line-height:1.65\">Aplicamos procesos y parámetros orientados a obtener a futuro la certificación <strong style=\"color:#241A14\">HACCP</strong> e <strong style=\"color:#241A14\">ISO 9001</strong>, estándares internacionales que respaldan nuestra seguridad alimentaria y calidad total, garantizando productos confiables y de alta calidad.</p><p style=\"color:#4C5A58;font-size:18px;line-height:1.65\">Nuestro enfoque inicial está en los más diversos puntos de venta del Paraguay, con planes de expansión hacia la exportación en los próximos años.</p></div></div></section><!-- ===================== IMPACTO ===================== --><section id=\"impacto\" style=\"padding:90px 28px;background:linear-gradient(180deg,#FBF1E4,#FFF4EA)\"><div class=\"reveal\" style=\"max-width:820px;margin:0 auto;text-align:center\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:14px;color:#C2410C\">¿A quién impactamos?</span><h2 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(30px,4.4vw,50px);line-height:1.02;text-transform:uppercase;margin-top:12px;color:#241A14\">Para quienes disfrutan la buena mesa</h2><p style=\"color:#4C5A58;font-size:20px;line-height:1.6;margin-top:18px\">Creamos productos para quienes disfrutan los sabores sofisticados y convierten cada comida en un momento especial: con amigos, en familia o en cualquier ocasión única. Porque comer bien también es disfrutar la vida.</p></div></section>\n\n  <!-- ===================== BENEFICIOS ===================== -->\n  <section style=\"padding:20px 28px 90px;background:#FFF4EA\">\n    <div class=\"reveal\" style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"text-align:center;margin-bottom:48px\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:14px;color:#C2410C\">Por qué Salsa Top<\u002Fspan>\n        <h2 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(30px,4.4vw,50px);line-height:1.02;text-transform:uppercase;margin-top:12px\">Sabor real, hecho con cuidado<\u002Fh2><div class=\"reveal\" style=\"max-width:900px;margin:22px auto 0;display:grid;gap:14px;text-align:left\"><p style=\"color:#4C5A58;font-size:17px;line-height:1.65\">Elaboramos productos artesanales con ingredientes naturales, frutas, verduras y condimentos frescos, muchos de nuestra propia finca, para ofrecerte frescura real y sabor auténtico en cada bocado.</p><p style=\"color:#4C5A58;font-size:17px;line-height:1.65\">No utilizamos colorantes ni esencias artificiales: el color, el aroma y el sabor son el resultado natural de una cuidadosa selección y combinación de ingredientes de alta calidad.</p><p style=\"color:#4C5A58;font-size:17px;line-height:1.65\">No es solo una salsa: es una experiencia gourmet, elaborada de forma artesanal y respaldada por estándares de calidad, para transformar cada comida en un momento especial.</p></div>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:22px\">\n        <div class=\"glow-card\" style=\"flex:1 1 240px;background:linear-gradient(180deg,#FFFFFF,#FBF1E4);border:1px solid rgba(60,45,35,.08);border-radius:18px;padding:30px 26px\">\n          <div style=\"width:52px;height:52px;border-radius:14px;background:rgba(239,51,64,.14);display:flex;align-items:center;justify-content:center;margin-bottom:18px\"><img src=\"logo-icono.png\" alt=\"\" style=\"height:30px\"><\u002Fdiv>\n          <h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:23px;text-transform:uppercase;margin-bottom:8px\">Elaboración artesanal<\u002Fh3>\n          <p style=\"color:#5E6B69;font-size:16px;line-height:1.55\">Recetas hechas a mano, en pequeños lotes, cuidando cada detalle del sabor.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"glow-card\" style=\"flex:1 1 240px;background:linear-gradient(180deg,#FFFFFF,#FBF1E4);border:1px solid rgba(60,45,35,.08);border-radius:18px;padding:30px 26px\">\n          <div style=\"width:52px;height:52px;border-radius:14px;background:rgba(255,130,0,.16);display:flex;align-items:center;justify-content:center;margin-bottom:18px\"><img src=\"logo-icono.png\" alt=\"\" style=\"height:30px\"><\u002Fdiv>\n          <h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:23px;text-transform:uppercase;margin-bottom:8px\">Ingredientes naturales<\u002Fh3>\n          <p style=\"color:#5E6B69;font-size:16px;line-height:1.55\">Frutas, verduras y condimentos frescos, muchos de nuestra propia finca.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"glow-card\" style=\"flex:1 1 240px;background:linear-gradient(180deg,#FFFFFF,#FBF1E4);border:1px solid rgba(60,45,35,.08);border-radius:18px;padding:30px 26px\">\n          <div style=\"width:52px;height:52px;border-radius:14px;background:rgba(255,209,0,.16);display:flex;align-items:center;justify-content:center;margin-bottom:18px\"><img src=\"logo-icono.png\" alt=\"\" style=\"height:30px\"><\u002Fdiv>\n          <h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:23px;text-transform:uppercase;margin-bottom:8px\">Sin aditivos artificiales<\u002Fh3>\n          <p style=\"color:#5E6B69;font-size:16px;line-height:1.55\">Color, aroma y sabor son el resultado natural de una selección cuidadosa. Sin colorantes ni esencias.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"glow-card\" style=\"flex:1 1 240px;background:linear-gradient(180deg,#FFFFFF,#FBF1E4);border:1px solid rgba(60,45,35,.08);border-radius:18px;padding:30px 26px\">\n          <div style=\"width:52px;height:52px;border-radius:14px;background:rgba(106,172,144,.16);display:flex;align-items:center;justify-content:center;margin-bottom:18px\"><img src=\"logo-icono.png\" alt=\"\" style=\"height:30px\"><\u002Fdiv>\n          <h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:23px;text-transform:uppercase;margin-bottom:8px\">Calidad garantizada<\u002Fh3>\n          <p style=\"color:#5E6B69;font-size:16px;line-height:1.55\">Trabajamos con procesos orientados a estándares HACCP e ISO 9001 para una calidad total.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== PRODUCTOS ===================== -->\n  <section id=\"productos\" style=\"padding:96px 28px;background:radial-gradient(110% 80% at 50% 0%,#FFFDF9,#FFF4EA 70%)\">\n    <div class=\"reveal\" style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"text-align:center;margin-bottom:52px\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:14px;color:#C2410C\">Nuestra línea gourmet<\u002Fspan>\n        <h2 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(32px,4.6vw,54px);line-height:1.02;text-transform:uppercase;margin-top:12px\">Productos Salsa Top<\u002Fh2>\n        <p style=\"color:#4C5A58;font-size:18px;max-width:56ch;margin:16px auto 0\">Una selección pensada para quienes disfrutan de los sabores sofisticados en c
